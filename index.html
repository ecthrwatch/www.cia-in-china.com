<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA in China</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.cia-in-china.com/">
    <meta property="og:title" content="CIA in China">
    <meta property="og:description" content="And you will know the truth, and the truth will set you free. — John 8:32">
    <meta property="og:image" content="https://www.cia-in-china.com/logo.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://www.cia-in-china.com/">
    <meta name="twitter:title" content="CIA in China">
    <meta name="twitter:description" content="And you will know the truth, and the truth will set you free. — John 8:32">
    <meta name="twitter:image" content="https://www.cia-in-china.com/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            color: #111;
            font-family: Georgia, 'Times New Roman', serif;
            padding: 2rem;
        }

        main {
            text-align: center;
            max-width: 600px;
        }

        .grid-title {
            display: inline-grid;
            grid-template-columns: repeat(5, 1em);
            grid-template-rows: 1em 0.4em 1em 0.4em 1em;
            column-gap: 0.1em;
            row-gap: 0;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            line-height: 1;
            overflow: visible;
        }

        .grid-title .sideways-i {
            font-size: 1em;
            transform: rotate(90deg);
            overflow: visible;
        }

        .grid-title .cross {
            font-size: 0.4em;
            overflow: visible;
        }

        .grid-title .ghost {
            opacity: 0.03;
        }

        .grid-title .hidden {
            color: transparent;
        }

        .grid-title {
            position: relative;
            overflow: hidden;
        }

        .grid-title::before {
            content: '';
            position: absolute;
            z-index: -1;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(128, 128, 128, 0.1);
            clip-path: polygon(
                /* Top of vertical beam */
                calc(50% - 0.3em) 0%,
                calc(50% + 0.3em) 0%,
                /* Right side down to crossbeam top */
                calc(50% + 0.3em) calc(1em + 0.4em / 2 - 0.24em),
                /* Right arm of crossbeam */
                calc(50% + 1em + 0.24em) calc(1em + 0.4em / 2 - 0.24em),
                calc(50% + 1em + 0.24em) calc(1em + 0.4em / 2 + 0.24em),
                /* Back to vertical beam right */
                calc(50% + 0.3em) calc(1em + 0.4em / 2 + 0.24em),
                /* Down to bottom */
                calc(50% + 0.3em) 100%,
                calc(50% - 0.3em) 100%,
                /* Up to crossbeam bottom-left */
                calc(50% - 0.3em) calc(1em + 0.4em / 2 + 0.24em),
                /* Left arm of crossbeam */
                calc(50% - 1em - 0.24em) calc(1em + 0.4em / 2 + 0.24em),
                calc(50% - 1em - 0.24em) calc(1em + 0.4em / 2 - 0.24em),
                /* Back to vertical beam left */
                calc(50% - 0.3em) calc(1em + 0.4em / 2 - 0.24em)
            );
        }

        .grid-title span {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        blockquote {
            font-size: 1.3rem;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .verse {
            font-size: 1rem;
            font-style: normal;
            color: #555;
        }

        footer {
            position: fixed;
            bottom: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .grid-title {
                font-size: 2rem;
            }

            blockquote {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="grid-title">
            <!-- Row 1: C H I N A (H and N at 5% opacity) -->
            <span>C</span><span class="ghost">H</span><span>I</span><span class="ghost">N</span><span>A</span>
            <!-- Row 2: ❤️‍🔥 in center -->
            <span></span><span></span><span class="cross hidden">❤️‍🔥</span><span></span><span></span>
            <!-- Row 3: C H I N A (C, H, A at 5% opacity) -->
            <span class="ghost">C</span><span class="ghost">H</span><span>I</span><span>N</span><span class="ghost">A</span>
            <!-- Row 4: cross in center -->
            <span></span><span></span><span class="cross hidden">✝</span><span></span><span></span>
            <!-- Row 5: C H I N A -->
            <span>C</span><span>H</span><span>I</span><span>N</span><span>A</span>
        </div>

        <blockquote>
            &ldquo;And you will know the truth, and the truth will set you free.&rdquo;
        </blockquote>
        <p class="verse">John 8:32</p>
    </main>
    <footer>
        CIA-in-China.com<br>
        &copy; Since April 1, 2026. All rights reserved.
    </footer>
</body>
</html>
